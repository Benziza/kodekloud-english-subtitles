<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>English Subtitle Finder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="logo" aria-hidden="true">CC</span>
        <div>
          <h1>English Subtitle Finder</h1>
          <p>Open the original subtitle track</p>
        </div>
      </header>

      <section id="status-card" class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <div>
          <strong id="status-title">Looking for subtitles...</strong>
          <p id="status-copy">Checking the video and its embedded player.</p>
        </div>
      </section>

      <section id="result" class="result" hidden>
        <span class="result-label">ENGLISH TRACK</span>
        <strong id="track-name">English</strong>
        <code id="subtitle-url"></code>
      </section>

      <button id="open" class="primary" type="button" disabled>Open subtitles in new tab</button>
      <button id="find" class="secondary" type="button">Search again</button>
      <p class="privacy">Runs locally and only reads subtitle track links.</p>
    </main>
    <script src="track-selector.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
